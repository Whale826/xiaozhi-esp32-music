name: Build music firmware

# 只手动触发：仓库页面 Actions → Build music firmware → Run workflow
on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    container:
      image: espressif/idf:v5.4.4
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Build bread-compact-wifi-lcd
        shell: bash
        run: |
          set -e
          . $IDF_PATH/export.sh

          # 1) 生成默认 sdkconfig（目标芯片 ESP32-S3）
          idf.py set-target esp32s3

          # 2) 选板型：面包板新版接线（WiFi）+ LCD
          echo "CONFIG_BOARD_TYPE_BREAD_COMPACT_WIFI_LCD=y" >> sdkconfig

          # 3) 编译（BOARD_NAME 只影响设备上报的名字）
          idf.py -DBOARD_NAME=bread-compact-wifi-lcd build

          # 4) 合并成整包（含 bootloader / 分区表 / app / assets）
          idf.py merge-bin

          echo "==== 板型确认 ===="
          grep -E "^CONFIG_BOARD_TYPE_.*=y" sdkconfig
          echo "==== 产物 ===="
          ls -lh build/merged-binary.bin

      - name: Upload merged binary
        uses: actions/upload-artifact@v4
        with:
          name: xiaozhi-music-bread-compact-wifi-lcd
          path: build/merged-binary.bin
          retention-days: 30
